site_name: TiDES
site_description: Real-time time-dependent electronic structure, built on PySCF
site_url: https://oholtfrank3.github.io/TIDES
repo_url: https://github.com/oholtfrank3/TIDES
repo_name: oholtfrank3/TIDES

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            members_order: source
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - First Calculation: getting-started/first-calculation.md
      - Running on HPC: getting-started/hpc.md
  - User Guide:
      - Propagation & Integrators: user-guide/integrators.md
      - Observables: user-guide/observables.md
      - External Potentials: user-guide/potentials.md
      - Spectroscopy: user-guide/spectroscopy.md
      - Ehrenfest Dynamics: user-guide/ehrenfest.md
      - Relativistic Methods: user-guide/relativistic.md
      - CAS/RAS Dynamics: user-guide/cas-ras.md
      - GPU Acceleration: user-guide/gpu.md
      - Fragments & NOSCF: user-guide/fragments.md
      - Restarts & Chkfiles: user-guide/restarts.md
  - Customization:
      - Custom Observables: customization/observables.md
      - Custom Potentials: customization/potentials.md
  - Examples: examples.md
  - API Reference: api/reference.md
  - Cite: cite.md
